name: Build AndroTweak APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. まず Android SDK のセットアップ用に JDK 17 を用意する
      - name: Set up JDK 17 for SDK Manager
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-19" "build-tools;28.0.3"

      # 2. 実際のアプリビルド（Gradle）用に JDK 8 へ切り替える
      - name: Switch to JDK 8 for Building Legacy App
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.9.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroTweak-Gingerbread-debug
          path: build/outputs/apk/debug/*.apk
